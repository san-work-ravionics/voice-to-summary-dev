<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice to Summary</title>
<link rel="stylesheet" href="/webapp/style.css">
</head>
<body>
<button id="drawer-toggle" class="drawer-toggle" aria-label="Toggle menu">☰</button>

<div class="app-shell">
  <aside id="sidebar" class="sidebar">
    <div class="brand">Voice to Summary</div>
    <nav class="side-nav">
      <button class="nav-item" data-page="demo" aria-pressed="false">Demo</button>
      <button class="nav-item" data-page="concepts" aria-pressed="true">Concepts</button>
      <button class="nav-item" data-page="roadmap" aria-pressed="false">Roadmap</button>
      <button class="nav-item" data-page="scenarios" aria-pressed="false">Scenarios</button>
      <button class="nav-item" data-page="story" aria-pressed="false">Story</button>
      <button class="nav-item" data-page="pipeline" aria-pressed="false">Pipeline</button>
      <button class="nav-item" data-page="voicequery" aria-pressed="false">Voice Query</button>
      <button class="nav-item" data-page="evaluation" aria-pressed="false">Evaluation</button>
    </nav>
  </aside>

  <main class="app-main">
    <section id="demo-page" class="page hidden">
      <div id="demo-root"></div>
    </section>

    <section id="concepts-page" class="page">
      <div id="concepts-root"></div>
    </section>

    <section id="roadmap-page" class="page hidden">
      <div id="roadmap-root"></div>
    </section>

    <section id="scenarios-page" class="page hidden">
      <div id="scenario-list">
        <div id="tech-summary"></div>
        <div id="eval-summary"></div>
        <div id="scenario-grid" class="scenario-grid"></div>
      </div>
      <div id="scenario-detail" class="scenario-detail hidden"></div>
    </section>

    <section id="story-page" class="page hidden">
      <div id="story-root"></div>
    </section>

    <section id="pipeline-page" class="page hidden">
      <div id="pipeline-root"></div>
    </section>

    <section id="voicequery-page" class="page hidden">
      <div id="voicequery-root"></div>
    </section>

    <section id="evaluation-page" class="page hidden">
      <div id="evaluation-root"></div>
    </section>
  </main>
</div>

<script src="/webapp/app.js"></script>
</body>
</html>
