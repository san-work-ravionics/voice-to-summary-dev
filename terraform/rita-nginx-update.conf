# RITA EC2 nginx config — hostname-based routing for both apps.
# Apply manually: copy to /etc/nginx/sites-available/default on RITA EC2,
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace 10.0.2.14 with the terraform output: vts_private_ip

# ── RITA (riia.ravionics.nl) ─────────────────────────────────────────────────

server {
    listen 80;
    server_name riia.ravionics.nl;

    location ~* \.(js|css)$ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /mcp/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}

# ── VtS (voice.ravionics.nl) ────────────────────────────────────────────────

server {
    listen 80;
    server_name voice.ravionics.nl;

    location / {
        proxy_pass http://10.0.2.14:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}

# ── Catch-all: drop unrecognized hostnames ───────────────────────────────────

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
