services:
  webapp:
    build: .
    ports:
      - "${PORT:-8743}:8743"
    environment:
      - SUMMARY_PROVIDER=${SUMMARY_PROVIDER:-local}
      - TRANSCRIBE_ENGINE=${TRANSCRIBE_ENGINE:-whisper}
      - VOXTRAL_MODEL=${VOXTRAL_MODEL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Bind-mounted (not named volumes) so the container reads/writes the
      # exact same directories a local `python vN/src/main.py` run would —
      # one shared history instead of two disconnected copies. This is what
      # made a container-only run "lose" all pre-Docker history: a named
      # volume starts empty and .dockerignore keeps these dirs out of the
      # build context, so there was nothing to seed it from.
      # Raw input recordings every phase below transcribes — see
      # audio-generation/README.md.
      - ./audio-generation/output:/app/audio-generation/output
      - ./phase1-baseline/output:/app/phase1-baseline/output
      - ./phase2-checklist/output:/app/phase2-checklist/output
      - ./phase3-context/output:/app/phase3-context/output
      - ./phase4-assistant/output:/app/phase4-assistant/output
      - ./phase5-office-agent/output:/app/phase5-office-agent/output
      - ./phase6-history/output:/app/phase6-history/output
      - ./phase7-reference-rag/output:/app/phase7-reference-rag/output
      - ./phase8-voice-query/output:/app/phase8-voice-query/output
      # Real (non-scripted) audio dropped via the Custom Audio page, and
      # its derived output.
      - ./custom/audio:/app/custom/audio
      - ./custom/output:/app/custom/output
      # Evaluation run history (used by the Evaluation page's provider
      # comparison) and cross-process pipeline stage-progress files.
      - ./eval/output:/app/eval/output
      - ./webapp/.run_status:/app/webapp/.run_status
      # Rotating application logs (webapp requests, pipeline run output).
      - ./logs:/app/logs
      # Whisper + Hugging Face model downloads — a named volume (not
      # bind-mounted) since this is pure binary cache, not something to keep
      # alongside the source tree. Whisper 'base' is tiny; the local Mistral
      # summarizer adds a few GB, and opting into TRANSCRIBE_ENGINE=voxtral
      # pulls Voxtral-Mini-3B (~9GB) here once, then reuses it.
      - model_cache:/cache
      # `ant auth login`'s browser-based session, read-only — lets
      # provider=claude authenticate the same way a host-side `python
      # main.py --provider claude` run does, without an API key in .env/
      # the repo. The anthropic SDK auto-discovers credentials from
      # ~/.config/anthropic (see anthropic/lib/credentials/_constants.py);
      # the container runs as root, so its home is /root.
      - ${HOME}/.config/anthropic:/root/.config/anthropic:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8743/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  model_cache:
